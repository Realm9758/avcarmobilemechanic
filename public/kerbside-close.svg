<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!--
    The same lamp as public/kerbside.svg, turned down and set square behind the
    closing band's phone number. Same seven-stop falloff and the same baked
    grain; the directional road and street-light washes are dropped, because
    the closing band has no road in it and a lateral throw there would read as
    a stray gradient rather than as the lamp coming back.

    Centred in its own asset rather than shifted with background-position, so
    the pool stays under the number at every width instead of drifting.
  -->
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.52" r="0.62">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity="0.34"/>
      <stop offset="0.12" stop-color="#8fb5ff" stop-opacity="0.24"/>
      <stop offset="0.27" stop-color="#4d89f5" stop-opacity="0.15"/>
      <stop offset="0.44" stop-color="#2e6fd9" stop-opacity="0.085"/>
      <stop offset="0.62" stop-color="#1d4c9c" stop-opacity="0.04"/>
      <stop offset="0.81" stop-color="#12305f" stop-opacity="0.014"/>
      <stop offset="1" stop-color="#0a1a34" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#lamp)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
