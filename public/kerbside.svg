<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    The hero's light source, produced as an asset rather than assembled from
    flat CSS ramps. This business has no photographs and stock imagery was
    refused, so the first viewport is lit instead of shot.

    The sibling site in this house system lights a fixed workshop: a warm lamp
    hanging over a floor. This business has no workshop. It arrives. So the
    light here is cold and lateral, thrown low across a road: the inspection
    lamp set down beside a car that stopped where it stopped, with the wash of
    a street light somewhere above and behind. The road and street washes are
    held deliberately low: lifted any further they stop reading as spill and
    start reading as a blue gradient hero, which is the stock template this
    page exists to refuse. The ground stays near-black; only the pool is lit.

    Falloff is authored across seven stops so the pool has a hot core, a long
    shoulder and a real edge. Grain is baked in over the top, both to kill
    banding on wide dark gradients and to give the light something to sit in.
  -->
  <defs>
    <!--
      Cobalt is a dark hue, so it needs more opacity than the amber sibling to
      throw the same amount of light on the same graphite. Judged against the
      render, not against the numbers.
    -->
    <radialGradient id="lamp" cx="0.2" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity="0.56"/>
      <stop offset="0.12" stop-color="#8fb5ff" stop-opacity="0.4"/>
      <stop offset="0.27" stop-color="#4d89f5" stop-opacity="0.25"/>
      <stop offset="0.44" stop-color="#2e6fd9" stop-opacity="0.14"/>
      <stop offset="0.62" stop-color="#1d4c9c" stop-opacity="0.068"/>
      <stop offset="0.81" stop-color="#12305f" stop-opacity="0.024"/>
      <stop offset="1" stop-color="#0a1a34" stop-opacity="0"/>
    </radialGradient>

    <!-- The throw along the road, flattened and stretched the way a low beam
         runs out sideways rather than forwards. -->
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c9fff" stop-opacity="0.092"/>
      <stop offset="0.2" stop-color="#4d89f5" stop-opacity="0.058"/>
      <stop offset="0.52" stop-color="#255ec0" stop-opacity="0.021"/>
      <stop offset="0.8" stop-color="#14356c" stop-opacity="0.005"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Keeps the road wash to the lower band without a hard cut. -->
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>

    <mask id="bandMask">
      <rect y="480" width="1600" height="520" fill="url(#band)"/>
    </mask>

    <!-- The street light: high, cold, far enough away to be almost nothing. -->
    <radialGradient id="street" cx="0.82" cy="-0.04" r="0.46">
      <stop offset="0" stop-color="#b7d0ff" stop-opacity="0.085"/>
      <stop offset="0.4" stop-color="#3a6fc8" stop-opacity="0.026"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#lamp)"/>
  <rect width="1600" height="1000" fill="url(#road)" mask="url(#bandMask)"/>
  <rect width="1600" height="1000" fill="url(#street)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
