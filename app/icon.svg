  <path d="M32 12 50 22.4v20.8L32 53.6 14 43.2V22.4z"
        fill="none" stroke="#4d89f5" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#4d89f5" stroke-width="5"/>
</svg>
